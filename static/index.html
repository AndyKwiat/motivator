<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light only">
<title>Comeback Club</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦶</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #22203f;
    --paper: #ffffff;
    --soft: #f6f4ff;
    --yellow: #ffd23f;
    --pink: #ff5d8f;
    --teal: #2ec4a6;
    --blue: #4d9de0;
    --orange: #ff8c42;
    --purple: #9b5de5;
    --muted: #6d6a8a;
    --line: 4px solid var(--ink);
    --pop: 0 6px 0 var(--ink);
  }
  * { box-sizing: border-box; }
  html, body { background: var(--paper); color: var(--ink); margin: 0; }
  body {
    font-family: "Fredoka", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
    font-size: 18px;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px 16px 80px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  svg { display: block; }

  /* ---------- header ---------- */
  header { display: flex; align-items: center; gap: 12px; margin: 4px 0 18px; }
  header .mascot { width: 96px; flex: none; animation: bob 2.6s ease-in-out infinite; transform-origin: 50% 90%; }
  header h1 { font-size: clamp(30px, 8vw, 46px); line-height: 1; margin: 0; font-weight: 700; letter-spacing: -.5px; }
  header h1 span { color: var(--pink); }
  header p { margin: 6px 0 0; color: var(--muted); font-size: 17px; font-weight: 500; }
  header .sun { width: 64px; margin-left: auto; flex: none; animation: spin 18s linear infinite; }
  @keyframes bob { 0%,100% { transform: rotate(-4deg) translateY(0); } 50% { transform: rotate(4deg) translateY(-6px); } }
  @keyframes spin { to { transform: rotate(360deg); } }

  .card {
    background: var(--paper);
    border: var(--line);
    border-radius: 28px;
    box-shadow: var(--pop);
    padding: 20px;
    margin: 0 0 22px;
    position: relative;
  }

  /* ---------- countdown ---------- */
  .countdown { background: var(--yellow); overflow: hidden; }
  .cd-top { display: flex; align-items: center; gap: 14px; }
  .cd-num {
    font-size: clamp(84px, 26vw, 140px); line-height: .85; font-weight: 700;
    color: var(--paper); -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill;
    text-shadow: 0 7px 0 var(--ink);
  }
  .cd-label { font-size: clamp(24px, 6.5vw, 34px); font-weight: 700; line-height: 1.05; }
  .cd-label small { display: block; font-size: 17px; font-weight: 500; margin-top: 6px; }
  .cd-tick {
    display: flex; gap: 8px; margin: 18px 0 6px;
  }
  .cd-tick div {
    background: var(--paper); border: var(--line); border-radius: 16px; padding: 6px 2px; min-width: 0;
    text-align: center; box-shadow: 0 4px 0 var(--ink); flex: 1;
  }
  .cd-tick b { display: block; font-size: clamp(22px, 6.5vw, 30px); line-height: 1.1; font-variant-numeric: tabular-nums; }
  .cd-tick span { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }

  .road { position: relative; margin: 52px 4px 8px; height: 34px; }
  .road-track {
    position: absolute; inset: 0; border: var(--line); border-radius: 20px; background: var(--paper); overflow: hidden;
  }
  .road-fill {
    height: 100%; border-radius: 14px 0 0 14px;
    background: repeating-linear-gradient(-45deg, var(--pink) 0 14px, #ff7ea6 14px 28px);
    border-right: var(--line);
    animation: slide 1.2s linear infinite; background-size: 40px 40px;
  }
  @keyframes slide { to { background-position: 40px 0; } }
  .road-walker { position: absolute; top: -50px; width: 52px; transform: translateX(-50%); transition: left 1s; }
  .road-walker svg { animation: hop .9s ease-in-out infinite; }
  @keyframes hop { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-6px) rotate(3deg); } }
  .road-finish { position: absolute; right: -6px; top: -46px; width: 54px; }
  .road-meta { display: flex; justify-content: space-between; font-weight: 600; font-size: 16px; margin-top: 10px; }

  /* ---------- sticker calendar ---------- */
  .cal-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; gap: 10px; }
  .cal-head h2 { margin: 0; font-size: 24px; }
  .cal-head span { color: var(--muted); font-weight: 500; font-size: 16px; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .dot {
    aspect-ratio: 1; border-radius: 50%; border: 3px solid var(--ink); background: var(--paper);
    display: grid; place-items: center; font-size: clamp(11px, 3vw, 15px); font-weight: 700; padding: 0;
    transition: transform .15s;
  }
  .dot:not(:disabled):active { transform: scale(.9); }
  .dot.done { background: var(--yellow); }
  .dot.part { background: linear-gradient(90deg, #bdf3e6 50%, var(--paper) 50%); }
  .dot.todo { background: #ffe1ea; }
  .dot.future { border-style: dashed; border-color: #c9c6dd; color: #c9c6dd; cursor: default; }
  .dot.goal { background: var(--teal); border-style: solid; border-color: var(--ink); color: var(--ink); }
  .dot.viewing { outline: 4px solid var(--pink); outline-offset: 2px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; font-size: 15px; color: var(--muted); font-weight: 500; }
  .legend i { display: inline-block; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ink); vertical-align: -2px; margin-right: 4px; }

  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 0 0 22px; }
  .stat { border: var(--line); border-radius: 20px; padding: 10px 6px; text-align: center; box-shadow: 0 4px 0 var(--ink); }
  .stat b { display: block; font-size: 32px; line-height: 1.1; }
  .stat span { font-size: 14px; font-weight: 600; }
  .stat:nth-child(1) { background: #d9f7f0; }
  .stat:nth-child(2) { background: #ffe1ea; }

  /* ---------- day nav ---------- */
  .banner {
    background: var(--purple); color: var(--paper); border: var(--line); border-radius: 22px; box-shadow: var(--pop);
    padding: 14px 18px; font-size: 20px; font-weight: 600; margin: 0 0 18px; display: flex; gap: 12px; align-items: center;
  }
  .banner .big { font-size: 34px; }
  .daynav { display: flex; align-items: center; gap: 10px; margin: 0 0 18px; position: sticky; top: 8px; z-index: 5; }
  .daynav .mid {
    flex: 1; text-align: center; background: var(--paper); border: var(--line); border-radius: 22px; padding: 8px 6px;
    box-shadow: 0 4px 0 var(--ink);
  }
  .daynav .mid b { display: block; font-size: clamp(24px, 6.5vw, 30px); line-height: 1.1; }
  .daynav .mid span { color: var(--muted); font-weight: 500; font-size: 16px; }
  .arrow {
    width: 64px; height: 64px; flex: none; border-radius: 50%; border: var(--line); background: var(--teal);
    font-size: 30px; font-weight: 700; box-shadow: 0 5px 0 var(--ink); display: grid; place-items: center;
    transition: transform .1s, box-shadow .1s;
  }
  .arrow:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
  .arrow:disabled { background: #eceaf5; color: #b3b0c9; border-color: #c9c6dd; box-shadow: 0 5px 0 #c9c6dd; cursor: not-allowed; }

  /* ---------- quotes ---------- */
  .quote { padding: 24px 22px 22px; overflow: hidden; transition: transform .3s; }
  .quote.g { background: #fff1e4; }
  .quote.k { background: #e2f3ff; }
  .quote.w { background: #efe7ff; }
  .tag {
    display: inline-flex; align-items: center; gap: 8px; border: 3px solid var(--ink); border-radius: 999px;
    padding: 4px 14px; font-weight: 700; font-size: 16px; background: var(--paper); transform: rotate(-2deg);
  }
  .tag svg { width: 34px; height: 34px; }
  .quote blockquote {
    margin: 18px 0 12px; font-size: clamp(27px, 7.2vw, 40px); line-height: 1.22; font-weight: 600; letter-spacing: -.2px;
  }
  .quote blockquote::before { content: "“"; color: var(--pink); font-size: 1.4em; line-height: 0; vertical-align: -.35em; margin-right: 2px; }
  .quote .who { font-size: 21px; font-weight: 500; color: var(--muted); }
  .quote .who::before { content: "— "; }

  .bigbtn {
    display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; margin-top: 20px;
    border: var(--line); border-radius: 22px; padding: 16px; font-size: 26px; font-weight: 700;
    box-shadow: 0 6px 0 var(--ink); transition: transform .1s, box-shadow .1s; background: var(--teal);
  }
  .bigbtn:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--ink); }
  .bigbtn.pink { background: var(--pink); color: var(--paper); }
  .bigbtn.yellow { background: var(--yellow); }

  .stamp {
    display: flex; align-items: center; gap: 12px; margin-top: 18px; padding: 10px 14px; border-radius: 18px;
    background: rgba(255,255,255,.75); border: 3px dashed var(--ink); font-weight: 600; font-size: 17px;
  }
  .stamp .seal {
    flex: none; width: 52px; height: 52px; border-radius: 50%; background: var(--teal); border: 3px solid var(--ink);
    display: grid; place-items: center; font-size: 28px; transform: rotate(-12deg);
  }
  .stamp small { color: var(--muted); font-weight: 500; font-size: 16px; }
  .pop-in { animation: popin .45s cubic-bezier(.3,1.6,.5,1); }
  @keyframes popin { from { transform: scale(.4) rotate(-10deg); opacity: 0; } to { transform: none; opacity: 1; } }

  .grateful { background: #fff0f5; text-align: center; }
  .grateful h3 { margin: 0; font-size: clamp(26px, 7vw, 34px); }
  .grateful p { margin: 8px 0 0; font-size: 19px; color: var(--muted); font-weight: 500; }
  .grateful .heart { width: 110px; margin: 0 auto 6px; }
  .grateful .heart svg { animation: beat 1.2s ease-in-out infinite; }
  @keyframes beat { 0%,100% { transform: scale(1); } 15% { transform: scale(1.12); } 30% { transform: scale(1); } 45% { transform: scale(1.08); } }
  .grateful .bigbtn { font-size: 32px; padding: 22px; }

  .complete { background: #dcfaf2; text-align: center; overflow: hidden; }
  .complete .rainbow { width: 200px; margin: 0 auto; }
  .complete h3 { margin: 4px 0 6px; font-size: clamp(30px, 8vw, 40px); }
  .complete p { margin: 0; font-size: 20px; font-weight: 500; }

  .sticker { position: absolute; width: 74px; right: -8px; top: -26px; transform: rotate(12deg); }
  .daypic { width: 110px; margin: -6px auto 14px; }
  .loading { text-align: center; padding: 80px 0; font-size: 26px; font-weight: 600; }
  .loading svg { width: 120px; margin: 0 auto 12px; animation: bob 1s ease-in-out infinite; }

  .confetti { position: fixed; pointer-events: none; z-index: 50; font-size: 26px; will-change: transform, opacity; }

  @media (min-width: 760px) {
    .wrap { padding-top: 28px; }
    header .mascot { width: 120px; }
    header .sun { width: 84px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

<div class="wrap" id="app">

  </svg>`,
};
const CATS = {
  g: { label: 'GET MOVING', art: 'flame' },
  k: { label: "IT'LL BE OK", art: 'cloud' },
  w: { label: 'TIMELESS WISDOM', art: 'owl' },
};
const DAY_PICS = ['sun', 'star', 'icecream', 'dog', 'balloon', 'rainbow', 'sneaker'];
const SLOTS = ['q0', 'q1', 'q2'];
const ALL = [...SLOTS, 'grateful'];

// ---------- state ----------
const tz = -new Date().getTimezoneOffset();
let S = null;          // server state
let view = 1;          // day number being viewed
let tickTimer = null;

const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const parseDay = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const fmtDate = (s) => parseDay(s).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
const fmtWhen = (iso) => new Date(iso).toLocaleString(undefined, { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
const pick = (arr, n) => arr[((n % arr.length) + arr.length) % arr.length];
const dayObj = (n) => S.days[n - 1];
const isDone = (d) => ALL.every((k) => d.acks[k]);
const ackCount = (d) => ALL.filter((k) => d.acks[k]).length;

function firstUnfinished() {
  const d = S.days.find((d) => !isDone(d));
  return d ? d.day : S.today;
}

async function load() {
  $('#loading').innerHTML = ART.aircast + 'Warming up the boot…';
  const r = await fetch(`/api/state?tz=${tz}`, { cache: 'no-store' });
  if (!r.ok) throw new Error(await r.text());
  S = await r.json();
  view = firstUnfinished();
  render();
  if (!tickTimer) tickTimer = setInterval(tick, 1000);
}

async function ack(kind, btn) {
  const d = dayObj(view);
  if (d.acks[kind]) return;
  const rect = btn.getBoundingClientRect();
  btn.disabled = true;
  try {
    const r = await fetch('/api/ack', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ day: view, kind, tz }),
    });
    if (!r.ok) throw new Error(await r.text());
    const res = await r.json();
    const wasDone = isDone(d);
    d.acks = res.acks;
    confetti(rect.left + rect.width / 2, rect.top + rect.height / 2, kind === 'grateful' ? ['💖', '💛', '🙏', '✨'] : ['⭐', '🎉', '✨', '💪']);
    renderDay(kind);
    renderTop();
    if (!wasDone && isDone(d)) {
      setTimeout(() => { confetti(innerWidth / 2, innerHeight / 3, ['🎉', '🏆', '⭐', '🥳', '👟'], 60); }, 250);
      setTimeout(() => $('#complete')?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 500);
    }
  } catch (e) {
    btn.disabled = false;
    alert('Oops, that did not save: ' + e.message);
  }
}

function go(n) {
  if (n < 1 || n > S.today) return;
  view = n;
  renderDay();
  renderTop();
  window.scrollTo({ top: 0, behavior: 'instant' });
}

// ---------- render ----------
function render() {
  $('#app').innerHTML = `
    <header>
      <div class="mascot">${ART.aircast}</div>
      <div>
        <h1>Comeback <span>Club</span></h1>
        <p>Healing one day at a time 🦶✨</p>
      </div>
      <div class="sun">${ART.sun}</div>
    </header>
    <section class="card countdown" id="countdown"></section>
    <div class="stats" id="stats"></div>
    <div id="banner"></div>
    <nav class="daynav" id="daynav"></nav>
    <main id="day"></main>
    <section class="card" id="calendar"></section>
`;
  renderTop();
  renderDay();
  tick();
}

function renderTop() {
  const total = S.total_days;
  const goal = parseDay(S.goal);
  const todayDate = new Date(); todayDate.setHours(0, 0, 0, 0);
  const daysLeft = Math.max(0, Math.round((goal - todayDate) / 86400000));
  const pct = Math.min(100, Math.max(0, ((S.today - 1) / (total - 1)) * 100));

  $('#countdown').innerHTML = `
    <div class="cd-top">
      <div class="cd-num">${daysLeft}</div>
      <div class="cd-label">${daysLeft === 0 ? 'TODAY IS THE DAY! 🎉' : daysLeft === 1 ? 'day to go!' : 'days to go!'}
        <small>until ${goal.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' })} 👟</small>
      </div>
    </div>
    <div class="cd-tick" id="tick"></div>
    <div class="road" aria-label="${Math.round(pct)}% of the way there">
      <div class="road-track"><div class="road-fill" style="width:${pct}%"></div></div>
      <div class="road-walker" style="left:${Math.max(4, Math.min(88, pct))}%">${ART.aircast}</div>
      <div class="road-finish">${ART.sneaker}</div>
    </div>
    <div class="road-meta"><span>Day ${S.today} of ${total}</span><span>${Math.round(pct)}% there!</span></div>`;

  const read = S.days.reduce((n, d) => n + SLOTS.filter((k) => d.acks[k]).length, 0);
  const grateful = S.days.filter((d) => d.acks.grateful).length;
  $('#stats').innerHTML = `
    <div class="stat"><b>${read}</b><span>📖<br>quotes read</span></div>
    <div class="stat"><b>${grateful}</b><span>💖<br>grateful days</span></div>`;

  const behind = S.days.filter((d) => d.day < S.today && !isDone(d)).length;
  $('#banner').innerHTML = behind > 0 && view < S.today
    ? `<div class="banner"><span class="big">🏃</span><span>Catch-up mode! ${behind} earlier day${behind > 1 ? 's' : ''} still waiting for you. You've got this!</span></div>`
    : '';

  const d = dayObj(view);
  $('#daynav').innerHTML = `
    <button class="arrow" aria-label="Previous day" ${view <= 1 ? 'disabled' : ''} onclick="go(view-1)">◀</button>
    <div class="mid"><b>Day ${view}${view === S.today ? ' · Today' : ''}</b><span>${fmtDate(d.date)} · ${ackCount(d)}/4 done</span></div>
    <button class="arrow" aria-label="${view >= S.today ? 'Tomorrow is locked' : 'Next day'}" ${view >= S.today ? 'disabled' : ''} onclick="go(view+1)">${view >= S.today ? '🔒' : '▶'}</button>`;

  let cells = '';
  for (let n = 1; n <= total; n++) {
    let cls = 'future', label = n;
    if (n <= S.today) {
      const dd = dayObj(n);
      cls = isDone(dd) ? 'done' : ackCount(dd) > 0 ? 'part' : 'todo';
      if (isDone(dd)) label = '⭐';
    }
    if (n === total) { cls += ' goal'; label = '👟'; }
    if (n === view) cls += ' viewing';
    cells += `<button class="dot ${cls}" ${n > S.today ? 'disabled' : ''} onclick="go(${n})" aria-label="Day ${n}">${label}</button>`;
  }
  const doneDays = S.days.filter(isDone).length;
  $('#calendar').innerHTML = `
    <div class="cal-head"><h2>Sticker chart 🌟</h2><span>${doneDays} of ${total} days</span></div>
    <div class="cal">${cells}</div>
    <div class="legend">
      <span><i style="background:var(--yellow)"></i>all done</span>
      <span><i style="background:linear-gradient(90deg,#bdf3e6 50%,#fff 50%)"></i>started</span>
      <span><i style="background:#ffe1ea"></i>waiting</span>
      <span><i style="border-style:dashed;border-color:#c9c6dd"></i>locked</span>
    </div>`;
  tick();
}

function renderDay(justAcked) {
  const d = dayObj(view);
  const quotes = d.quotes.map((q, i) => {
    const kind = SLOTS[i];
    const at = d.acks[kind];
    const c = CATS[q.cat] || CATS.w;
    return `
      <article class="card quote ${q.cat}">
        <span class="tag" aria-label="${c.label}">${ART[c.art]}</span>
        <blockquote>${esc(q.text)}</blockquote>
        <div class="who">${esc(q.author)}</div>
        ${at
          ? `<div class="stamp ${justAcked === kind ? 'pop-in' : ''}"><span class="seal">✓</span><small>Read ${fmtWhen(at)}</small></div>`
          : `<button class="bigbtn" onclick="ack('${kind}', this)">👍 I read it!</button>`}
      </article>`;
  }).join('');

  const gAt = d.acks.grateful;
  const grateful = `
    <section class="card grateful">
      <div class="heart">${ART.heart}</div>
      ${gAt
        ? `<div class="${justAcked === 'grateful' ? 'pop-in' : ''}">
             <p>Tapped ${fmtWhen(gAt)}</p>
           </div>`
        : `<h3>One thing you're thankful for?</h3>
           <p>Think of it, smile, then tap.</p>
           <button class="bigbtn pink" onclick="ack('grateful', this)">🙏 I'm grateful</button>`}
    </section>`;

  let complete = '';
  if (isDone(d)) {
    const nextOpen = S.days.find((x) => x.day > view && !isDone(x));
    complete = `
      <section class="card complete ${justAcked ? 'pop-in' : ''}" id="complete">
        <div class="rainbow">${ART.rainbow}</div>
        <h3>Day ${view} complete! 🎉</h3>
        ${nextOpen
          ? `<p>Day ${nextOpen.day} is ready for you.</p><button class="bigbtn yellow" onclick="go(${nextOpen.day})">Next up: Day ${nextOpen.day} ▶</button>`
          : view === S.today || !S.days.some((x) => !isDone(x))
            ? `<p>All caught up! 🌈 New quotes unlock in <b id="unlock"></b>.</p>`
            : ''}
      </section>`;
  }

  const finale = view === S.total_days
    ? `<section class="card complete"><div class="daypic">${ART.trophy}</div><h3>YOU MADE IT! 🏆👟</h3><p>Three months of showing up. Lace up those sneakers!</p></section>`
    : '';

  $('#day').innerHTML = `
    <div class="daypic">${ART[pick(DAY_PICS, view)]}</div>
    ${finale}${quotes}${grateful}${complete}`;
  tick();
}

function tick() {
  if (!S) return;
  const now = new Date();
  const goal = parseDay(S.goal);
  let ms = Math.max(0, goal - now);
  const d = Math.floor(ms / 86400000); ms -= d * 86400000;
  const h = Math.floor(ms / 3600000); ms -= h * 3600000;
  const m = Math.floor(ms / 60000); ms -= m * 60000;
  const s = Math.floor(ms / 1000);
  const el = $('#tick');
  if (el) el.innerHTML = [[d, 'days'], [h, 'hours'], [m, 'mins'], [s, 'secs']]
    .map(([v, l]) => `<div><b>${String(v).padStart(2, '0')}</b><span>${l}</span></div>`).join('');

  const tomorrow = new Date(now); tomorrow.setHours(24, 0, 0, 0);
  const left = tomorrow - now;
  const u = $('#unlock');
  if (u) u.textContent = `${Math.floor(left / 3600000)}h ${Math.floor(left / 60000) % 60}m`;

  // A new day started while the page was open: refresh so the new quotes show up.
  const todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
  const last = S.days[S.days.length - 1];
  if (last && todayStr > last.date && S.today < S.total_days && !tick.reloading) {
    tick.reloading = true;
    load().finally(() => { tick.reloading = false; });
  }
}

function confetti(x, y, chars, n = 22) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  for (let i = 0; i < n; i++) {
    const el = document.createElement('div');
    el.className = 'confetti';
    el.textContent = chars[i % chars.length];
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    document.body.appendChild(el);
    const angle = Math.random() * Math.PI * 2;
    const dist = 80 + Math.random() * 160;
    const dx = Math.cos(angle) * dist, dy = Math.sin(angle) * dist - 80;
    el.animate([
      { transform: 'translate(-50%,-50%) scale(.4)', opacity: 1 },
      { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) rotate(${Math.random() * 360}deg) scale(1.1)`, opacity: 1, offset: .6 },
      { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy + 120}px)) rotate(${Math.random() * 720}deg) scale(.8)`, opacity: 0 },
    ], { duration: 1100 + Math.random() * 500, easing: 'cubic-bezier(.2,.7,.4,1)' }).onfinish = () => el.remove();
  }
}

load().catch((e) => {
  $('#app').innerHTML = `<div class="loading">${ART.cloud}Couldn't load today's quotes.<br><small>${esc(e.message)}</small><br><button class="bigbtn" onclick="location.reload()">Try again</button></div>`;
});
</script>
</body>
</html>
